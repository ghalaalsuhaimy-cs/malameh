<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<title>ملامح</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --sand:#f6ecd8;--card:#fffaf0;--ink:#3b2a1a;--muted:#7d6a52;
  --accent:#b4642a;--on:#ffffff;--dune:#ecd7a8;--line:#e5d4b2;--camel:#6b4220;--err:#b3261e;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --sand:#1f1b2d;--card:#2a2540;--ink:#f3e8d2;--muted:#b9a98f;
    --accent:#f0a95a;--on:#2b1b0a;--dune:#35304f;--line:#443d63;--camel:#120e1e;--err:#ff9a8f;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --sand:#1f1b2d;--card:#2a2540;--ink:#f3e8d2;--muted:#b9a98f;
  --accent:#f0a95a;--on:#2b1b0a;--dune:#35304f;--line:#443d63;--camel:#120e1e;--err:#ff9a8f;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--sand);color:var(--ink);
  font-family:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;font-size:16px;line-height:1.65}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sand)}
.wrap{max-width:1100px;margin:0 auto;position:relative;z-index:2;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- الواجهة العلوية ---------- */
.hero{position:relative;background:var(--dune);overflow:hidden;padding-block:22px 135px}
.lang{display:inline-flex;direction:ltr;background:var(--sand);border-radius:14px;padding:4px;gap:4px}
.lang button{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:500;
  padding:7px 14px;border-radius:10px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--on)}
.brand{margin:26px 0 0;font-weight:600;color:var(--accent)}
h1{font-size:2.6rem;font-weight:600;margin:2px 0 8px;line-height:1.2;text-wrap:balance}
.tagline{margin:0;max-width:34ch;font-size:1.05rem}
.sun{position:absolute;bottom:40px;width:90px;height:90px;border-radius:50%;background:var(--accent);z-index:1}
html[dir="rtl"] .sun{left:14%}
html[dir="ltr"] .sun{right:14%}
.caravan{position:absolute;bottom:26px;z-index:2;display:flex;align-items:flex-end;gap:4px;
  direction:ltr;color:var(--camel);animation:walk 2.6s ease-out both}
html[dir="rtl"] .caravan{left:3%}
html[dir="ltr"] .caravan{right:3%}
.caravan svg{display:block;height:auto}
.c1{width:104px}.c2{width:88px}.c3{width:72px}
@keyframes walk{from{transform:translateX(-50px);opacity:0}to{transform:none;opacity:1}}
.dunes{position:absolute;left:0;bottom:-1px;width:100%;height:78px;fill:var(--sand);z-index:3;display:block}

/* ---------- شريط المدن والاهتمامات ---------- */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sand);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;gap:8px;overflow-x:auto;padding-block:10px}
.chip{white-space:nowrap;text-decoration:none;color:var(--ink);background:var(--card);
  border:1px solid var(--line);border-radius:999px;padding:6px 16px;font:inherit;font-weight:500;cursor:pointer}
.chip:hover,.chip[aria-pressed="true"]{background:var(--accent);color:var(--on);border-color:var(--accent)}
.interests{max-width:1100px;margin:0 auto;padding-block:18px 0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.interests p{margin:0 0 8px;font-weight:600}
.interests .row{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- التخطيط ---------- */
.layout{max-width:1100px;margin:0 auto;padding-block:18px 60px;display:grid;gap:24px;grid-template-columns:minmax(0,1fr);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.city{background:var(--card);border:1px solid var(--line);border-radius:24px;
  padding:24px 20px;margin-bottom:24px;scroll-margin-top:70px}
.city h2{font-size:2rem;font-weight:600;margin:0 0 8px;line-height:1.2}
.pill{display:inline-block;background:var(--dune);font-size:.82rem;border-radius:999px;padding:2px 14px}
.sum{margin:12px 0 20px;color:var(--muted);max-width:60ch}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px;align-items:start}
.panel{background:var(--sand);border-radius:16px;padding:16px;min-width:0}
.panel h3{font-size:1.02rem;font-weight:600;margin:0 0 8px}
ul{list-style:none;margin:0;padding:0}
li{padding:9px 0;border-top:1px solid var(--line)}
li strong{font-weight:600}
li span{display:block;color:var(--muted);font-size:.92rem}
li .meta{font-size:.82rem}
.tag{display:inline-block;font-size:.75rem;background:var(--dune);border-radius:999px;padding:1px 9px;margin-inline-start:6px;font-weight:400;color:var(--ink)}
.book{margin-top:6px;background:var(--accent);color:var(--on);border:0;border-radius:10px;
  padding:5px 14px;font:inherit;font-size:.85rem;font-weight:600;cursor:pointer}

/* ---------- مزايا إضافية ---------- */
.themebtn{margin-inline-start:10px;border:1px solid var(--line);background:var(--sand);color:var(--ink);font:inherit;font-weight:500;padding:7px 14px;border-radius:14px;cursor:pointer;vertical-align:middle}
.tents{position:absolute;bottom:26px;z-index:2;display:flex;align-items:flex-end;gap:6px;color:var(--camel)}
html[dir="rtl"] .tents{right:3%}
html[dir="ltr"] .tents{left:3%}
.tents svg{display:block;height:auto}
.t1{width:96px}.t2{width:68px}
.scene{margin:0 0 16px;border-radius:16px;overflow:hidden}
.scene svg,.scene img{width:100%;height:160px;display:block;object-fit:cover}
.climate{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.climate span{background:var(--sand);border-radius:999px;padding:3px 12px;font-size:.88rem}
.climate .avg{background:transparent;color:var(--muted);font-size:.78rem;padding-inline:0}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.photobtn{border:1px dashed var(--line);color:var(--muted);border-radius:999px;padding:3px 12px;font-size:.85rem;cursor:pointer}
/* ---------- لوحة الحجوزات ---------- */
.side{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px;scroll-margin-top:70px;min-width:0}
.side h2{font-size:1.3rem;margin:0 0 4px}
.side h3{font-size:1.05rem;margin:22px 0 6px}
label{display:block;font-size:.88rem;color:var(--muted);margin-top:10px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--sand);border:1.5px solid var(--line);
  border-radius:11px;padding:9px 10px;margin-top:4px;min-width:0}
.btn{width:100%;margin-top:14px;background:var(--accent);color:var(--on);border:0;border-radius:12px;
  padding:11px 16px;font:inherit;font-weight:600;cursor:pointer}
.total{margin:12px 0 0;font-weight:600}
#msg{min-height:1.4em;margin:8px 0 0;color:var(--accent);font-size:.92rem}
#msg.err{color:var(--err)}
.bk{padding:10px 0;border-top:1px solid var(--line)}
.bk strong{display:block}
.ids{font-family:ui-monospace,Consolas,monospace;font-size:.76rem;color:var(--muted);direction:ltr;text-align:start;overflow-wrap:anywhere}
.st{display:inline-block;font-size:.78rem;background:var(--dune);border-radius:999px;padding:1px 10px;margin-inline-end:8px}
.cancel{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:2px 10px;font:inherit;font-size:.8rem;cursor:pointer}
.note{color:var(--muted);font-size:.8rem;margin:14px 0 0}
.fab{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));
  inset-inline-end:max(16px,env(safe-area-inset-left,0px),env(safe-area-inset-right,0px));z-index:30;
  background:var(--accent);color:var(--on);text-decoration:none;font-weight:600;border-radius:999px;
  padding:11px 18px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.credit{text-align:center;color:var(--muted);font-size:.85rem;margin:6px 0 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}

@media (min-width:980px){
  .layout{grid-template-columns:minmax(0,1fr) 340px;align-items:start}
  .side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);max-height:calc(100vh - 84px - env(safe-area-inset-top,0px));overflow:auto}
  .fab{display:none}
}
@media (max-width:420px){
  h1{font-size:2.1rem}
  .c1{width:78px}.c2{width:66px}.c3{width:54px}
  .sun{width:70px;height:70px}
  .t1{width:70px}.t2{width:50px}
  .hero{padding-bottom:125px}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .caravan{animation:none}
}

/* ---------- غروب متحرك + نجوم ---------- */
.sun{animation:sunset 20s ease-in-out infinite alternate}
@keyframes sunset{from{transform:translateY(-20px)}to{transform:translateY(95px)}}
.hero{animation:skyshift 20s ease-in-out infinite alternate}
@keyframes skyshift{from{background-color:var(--dune)}to{background-color:color-mix(in srgb,var(--accent) 38%,var(--dune))}}
.stars{position:absolute;inset:0;z-index:0;pointer-events:none;opacity:0;transition:opacity .6s}
.stars::before,.stars::after{content:"";position:absolute;top:0;left:0;width:2px;height:2px;border-radius:50%}
.stars::before{box-shadow:8vw 24px #fff7e0,18vw 70px #fff7e0,31vw 18px #fff7e0,44vw 60px #fff7e0,57vw 30px #fff7e0,68vw 84px #fff7e0,79vw 22px #fff7e0,90vw 58px #fff7e0,96vw 14px #fff7e0,12vw 110px #fff7e0}
.stars::after{box-shadow:5vw 50px #fff7e0,22vw 40px #fff7e0,36vw 96px #fff7e0,50vw 12px #fff7e0,63vw 66px #fff7e0,74vw 48px #fff7e0,85vw 100px #fff7e0,93vw 36px #fff7e0;animation:twinkle 3s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.15}to{opacity:1}}
:root[data-theme="dark"] .stars{opacity:1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .stars{opacity:1}}
@media (prefers-reduced-motion:reduce){.sun,.hero,.stars::after{animation:none}}
/* ---------- أشخاص + نطق الاسم + نص عن السعودية ---------- */
.pm,.pw{width:34px}
.speak{border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:999px;padding:3px 12px;font:inherit;font-size:.85rem;cursor:pointer}
.speak:hover{background:var(--accent);color:var(--on)}
.about{max-width:62ch;margin:36px auto 0;text-align:center;color:var(--muted);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.about::before{content:"✦";display:block;color:var(--accent);margin-bottom:6px}
@media (max-width:420px){.pm,.pw{width:28px}.t2{display:none}}
</style>
</head>

  {id: 9, city: 9, hours: 8, price: 400, cap: 12, inc: [0], name: L("جولة جزر فرسان", "Farasan Islands Tour", "Visite des îles Farasan")},
  {id: 10, city: 10, hours: 5, price: 230, cap: 15, inc: [0, 1], name: L("جولة ذي عين ورغدان", "Dhee Ain & Raghadan Tour", "Visite de Dhee Ain et de Raghadan")},
  {id: 11, city: 11, hours: 3, price: 130, cap: 20, inc: [0], name: L("جولة ينبع البلد", "Yanbu Old Town Tour", "Visite de la vieille ville de Yanbu")}
);

/* متوسطات حرارة تقريبية (°C): [العظمى, الصغرى] في يناير ويوليو */
const CLIMATE = {
  1: {jan: [21, 8], jul: [43, 28]}, 2: {jan: [22, 6], jul: [40, 24]}, 3: {jan: [29, 19], jul: [38, 28]},
  4: {jan: [21, 7], jul: [28, 16]}, 5: {jan: [21, 9], jul: [44, 29]}, 6: {jan: [22, 9], jul: [34, 20]},
  7: {jan: [18, 5], jul: [38, 22]}, 8: {jan: [17, 4], jul: [39, 22]}, 9: {jan: [30, 22], jul: [38, 29]},
  10: {jan: [22, 8], jul: [31, 19]}, 11: {jan: [27, 17], jul: [38, 27]}
};
const SCENE = {1: "tower", 2: "rocks", 3: "building", 4: "mountain", 5: "palms", 6: "mountain",
  7: "castle", 8: "rocks", 9: "sea", 10: "mountain", 11: "sea"};
const LAND = {
  tower: '<path d="M190 130 V40 L200 26 L210 40 V130 Z" fill="currentColor"/><rect x="214" y="70" width="14" height="60" fill="currentColor"/><rect x="172" y="86" width="14" height="44" fill="currentColor"/>',
  rocks: '<path d="M150 130 C150 90 165 70 185 72 C195 55 215 55 225 72 C245 70 260 95 258 130 Z" fill="currentColor"/><rect x="196" y="96" width="14" height="34" rx="3" style="fill:var(--dune)"/>',
  building: '<rect x="160" y="58" width="80" height="72" fill="currentColor"/><rect x="170" y="70" width="14" height="20" style="fill:var(--dune)"/><rect x="193" y="70" width="14" height="20" style="fill:var(--dune)"/><rect x="216" y="70" width="14" height="20" style="fill:var(--dune)"/><rect x="170" y="98" width="14" height="20" style="fill:var(--dune)"/><rect x="216" y="98" width="14" height="20" style="fill:var(--dune)"/>',
  mountain: '<path d="M110 130 L180 52 L215 95 L250 62 L310 130 Z" fill="currentColor"/>',
  palms: '<g fill="currentColor"><rect x="168" y="72" width="5" height="58"/><ellipse cx="170" cy="68" rx="24" ry="9"/><rect x="208" y="56" width="5" height="74"/><ellipse cx="210" cy="52" rx="28" ry="10"/><rect x="246" y="80" width="5" height="50"/><ellipse cx="248" cy="76" rx="22" ry="8"/></g>',
  castle: '<g fill="currentColor"><rect x="150" y="84" width="100" height="46"/><rect x="150" y="60" width="24" height="70"/><rect x="226" y="60" width="24" height="70"/><rect x="150" y="52" width="7" height="8"/><rect x="167" y="52" width="7" height="8"/><rect x="226" y="52" width="7" height="8"/><rect x="243" y="52" width="7" height="8"/></g><rect x="193" y="104" width="14" height="26" rx="7" style="fill:var(--dune)"/>',
  sea: '<path d="M0 118 C40 108 80 128 120 118 S200 108 240 118 S320 128 360 118 S400 108 400 118 V150 H0 Z" style="fill:var(--accent);opacity:.35"/><path d="M210 112 L210 56 L252 108 Z" fill="currentColor"/><path d="M198 114 H262 L250 126 H212 Z" fill="currentColor"/>'
};
let S = {bookings: [], users: [], nextBooking: 1001, nextUser: 1, interest: 0};
try { const raw = localStorage.getItem("malameh_state"); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}
S.photos = S.photos || {};
try { const th = localStorage.getItem("malameh_theme"); if (th) document.documentElement.setAttribute("data-theme", th); } catch (e) {}
const save = () => { try { localStorage.setItem("malameh_state", JSON.stringify(S)); } catch (e) {} };

let lang = "ar";
let filter = S.interest || 0;
const $ = id => document.getElementById(id);
const t = k => UI[lang][k];
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sep = () => lang === "ar" ? "، " : ", ";
const cityName = id => CITIES.find(c => c.id === id).name[lang];

function findItem(v){
  if(!v) return null;
  const kind = v[0], id = +v.slice(1);
  const obj = (kind === "T" ? TOURS : EVENTS).find(x => x.id === id);
  return obj ? {kind, obj} : null;
}
const booked = (kind, id) => S.bookings
  .filter(b => b.status !== "Cancelled" && (kind === "T" ? b.tourId === id : b.eventId === id))
  .reduce((n, b) => n + b.people, 0);

function panel(icon, title, items){
  return `<div class="panel"><h3>${icon} ${title}</h3><ul>${items.join("")}</ul></div>`;
}

function curTheme(){
  const a = document.documentElement.getAttribute("data-theme");
  if(a) return a;
  return window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}

function sceneHTML(c){
  const photo = S.photos[c.id];
  if(photo) return `<img src="${photo}" alt="${esc(c.name[lang])}">`;
  return `<svg viewBox="0 0 400 150" preserveAspectRatio="xMidYMid slice" role="img" aria-label="${esc(c.name[lang])}" style="color:var(--camel)">
    <rect width="400" height="150" style="fill:var(--dune)"/>
    <circle cx="316" cy="46" r="22" style="fill:var(--accent)"/>
    <path d="M0 118 C80 100 140 112 220 120 C300 128 350 108 400 114 V150 H0 Z" style="fill:var(--sand)"/>
    ${LAND[SCENE[c.id]]}
    <use href="#tent" x="24" y="84" width="72" height="54"/>
    <use href="#tent" x="316" y="96" width="50" height="38"/>
  </svg>`;
}

function climateHTML(c){
  const k = CLIMATE[c.id];
  const f = a => `<bdi>${a[0]}° / ${a[1]}°C</bdi>`;
  return `<div class="climate"><span>❄️ ${t("winter")} ${f(k.jan)}</span><span>☀️ ${t("summer")} ${f(k.jul)}</span><span class="avg">${t("avg")}</span></div>`;
}

function cityHTML(c){
  const places = c.places.map(p =>
    `<li><strong>${p.name[lang]}</strong><span>${p.desc[lang]}</span></li>`);
  const culture = c.culture.map(x =>
    `<li><strong>${ICONS[x.type]} ${x.name[lang]}<span class="tag">${t("types")[x.type]}</span></strong><span>${x.desc[lang]}</span></li>`);
  const events = EVENTS.filter(e => e.city === c.id).map(e =>
    `<li><strong>${e.name[lang]}</strong><span>${e.desc[lang]}</span>
      <span class="meta">${e.price} ${t("sar")} · ${t("cap")} ${e.cap}</span>
      <button class="book" type="button" data-book="E${e.id}">${t("book")}</button></li>`);
  const tours = TOURS.filter(x => x.city === c.id).map(x =>
    `<li><strong>${x.name[lang]}</strong>
      <span>${t("includes")}: ${x.inc.map(i => c.places[i].name[lang]).join(sep())}</span>
      <span class="meta">${x.hours} ${t("hours")} · ${x.price} ${t("sar")} · ${t("cap")} ${x.cap}</span>
      <button class="book" type="button" data-book="T${x.id}">${t("book")}</button></li>`);
  return `
    <section class="city" id="city-${c.id}">
      <div class="scene">${sceneHTML(c)}</div>
      <h2>${c.name[lang]}</h2>
      <span class="pill">${c.region[lang]}</span>
      ${climateHTML(c)}
      <div class="tools"><label class="photobtn">${t("photo")}<input type="file" accept="image/*" data-photo="${c.id}" hidden></label>${S.photos[c.id] ? `<button class="cancel" type="button" data-photodel="${c.id}">${t("photoDel")}</button>` : ""}</div>
      <p class="sum">${c.summary[lang]}</p>
      <div class="panels">
        ${panel("📍", t("places"), places)}
        ${panel("🌿", t("culture"), culture)}
        ${panel("🎉", t("events"), events)}
        ${panel("🧭", t("tours"), tours)}
      </div>
    </section>`;
}

function buildItems(){
  const sel = $("item"), cur = sel.value;
  sel.innerHTML = `<option value="">${t("choose")}</option>` +
    `<optgroup label="${t("tours")}">` +
      TOURS.map(x => `<option value="T${x.id}">${cityName(x.city)} — ${x.name[lang]}</option>`).join("") +
    `</optgroup><optgroup label="${t("events")}">` +
      EVENTS.map(x => `<option value="E${x.id}">${cityName(x.city)} — ${x.name[lang]}</option>`).join("") +
    `</optgroup>`;
  sel.value = cur;
}

function updateTotal(){
  const it = findItem($("item").value), n = parseInt($("people").value, 10);
  $("total").textContent = it && n > 0 ? `${t("total")}: ${it.obj.price * n} ${t("sar")}` : "";
}

function renderBookings(){
  const list = S.bookings.slice().reverse();
  $("fabN").textContent = S.bookings.filter(b => b.status !== "Cancelled").length;
  if(!list.length){ $("bookings").innerHTML = `<p class="note">${t("none")}</p>`; return; }
  $("bookings").innerHTML = list.map(b => {
    const it = findItem(b.tourId ? "T" + b.tourId : "E" + b.eventId);
    const u = S.users.find(x => x.id === b.userId) || {name: ""};
    return `<div class="bk">
      <strong>${it ? it.obj.name[lang] : ""}</strong>
      <span class="st">${t(b.status)}</span>${b.visitDate} · ${b.people} 👥 · ${esc(u.name)}
      <div class="ids">Booking_ID ${b.id} | User_ID ${b.userId} | Tour_ID ${b.tourId ?? "NULL"} | Event_ID ${b.eventId ?? "NULL"} | Booking_Date ${b.bookingDate} | Status ${b.status}</div>
      ${b.status !== "Cancelled" ? `<button class="cancel" type="button" data-cancel="${b.id}">${t("cancel")}</button>` : ""}
    </div>`;
  }).join("");
}

function render(){
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.title = t("brand");
  $("brand").textContent = t("brand");
  $("title").textContent = t("title");
  $("tagline").textContent = t("tagline");
  $("credit").textContent = t("credit");
  $("fabLabel").textContent = t("fab");
  $("themeBtn").textContent = curTheme() === "dark" ? t("themeLight") : t("themeDark");
  document.querySelectorAll("[data-i18n]").forEach(e => e.textContent = t(e.dataset.i18n));
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));

  $("interestRow").innerHTML =
    `<button class="chip" type="button" data-int="0" aria-pressed="${filter === 0}">${t("all")}</button>` +
    INTERESTS.map(i => `<button class="chip" type="button" data-int="${i.id}" aria-pressed="${filter === i.id}">${i.name[lang]}</button>`).join("");

  const shown = CITIES.filter(c => !filter || c.tags.includes(filter));
  $("nav").innerHTML = shown.map(c => `<a class="chip" href="#city-${c.id}">${c.name[lang]}</a>`).join("");
  $("cities").innerHTML = shown.map(cityHTML).join("");

  buildItems();
  updateTotal();
  renderBookings()
}

function say(text, isErr){
  const m = $("msg"); m.textContent = text; m.className = isErr ? "err" : "";
}

document.addEventListener("click", e => {
  const a = e.target.closest('a[href^="#"]');
  if(a){
    e.preventDefault();
    const el = $(a.getAttribute("href").slice(1));
    if(el) el.scrollIntoView({behavior: "smooth", block: "start"});
    return;
  }
  const lb = e.target.closest(".lang button");
  if(lb){ lang = lb.dataset.lang; render(); return; }
  const ib = e.target.closest("[data-int]");
  if(ib){ filter = +ib.dataset.int; S.interest = filter; save(); render(); return; }
  const bk = e.target.closest("[data-book]");
  if(bk){
    $("item").value = bk.dataset.book; updateTotal(); say("", false);
    $("booking").scrollIntoView({behavior: "smooth", block: "start"});
    setTimeout(() => $("visit").focus({preventScroll: true}), 400);
    return;
  }
  if(e.target.closest("#themeBtn")){
    const n = curTheme() === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", n);
    try { localStorage.setItem("malameh_theme", n); } catch (er) {}
    $("themeBtn").textContent = n === "dark" ? t("themeLight") : t("themeDark");
    return;
  }
  const pd = e.target.closest("[data-photodel]");
  if(pd){ delete S.photos[pd.dataset.photodel]; save(); const y = scrollY; render(); scrollTo(0, y); return; }
  const cb = e.target.closest("[data-cancel]");
  if(cb){
    const b = S.bookings.find(x => x.id === +cb.dataset.cancel);
    if(b){ b.status = "Cancelled"; save(); renderBookings(); }
  }
});

document.addEventListener("change", e => {
  const inp = e.target.closest("[data-photo]");
  if(!inp || !inp.files[0]) return;
  const id = inp.dataset.photo, file = inp.files[0];
  const img = new Image(), url = URL.createObjectURL(file);
  img.onload = () => {
    const w = Math.min(1000, img.width), h = Math.round(img.height * w / img.width);
    const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
    cv.getContext("2d").drawImage(img, 0, 0, w, h);
    URL.revokeObjectURL(url);
    S.photos[id] = cv.toDataURL("image/jpeg", 0.75);
    save(); const y = scrollY; render(); scrollTo(0, y);
  };
  img.src = url;
});
$("item").addEventListener("change", updateTotal);
$("people").addEventListener("input", updateTotal);

$("form").addEventListener("submit", e => {
  e.preventDefault();
  const it = findItem($("item").value);
  const visit = $("visit").value, n = parseInt($("people").value, 10);
  const name = $("name").value.trim(), email = $("email").value.trim(), phone = $("phone").value.trim();
  const today = new Date().toISOString().slice(0, 10);

  if(!it || !visit || visit < today || !(n >= 1) || !name || !/^\S+@\S+\.\S+$/.test(email) || !phone){
    say(t("errFill"), true); return;
  }
  const left = it.obj.cap - booked(it.kind, it.obj.id);
  if(n > left){ say(t("errCap") + Math.max(left, 0), true); return; }

  let u = S.users.find(x => x.email.toLowerCase() === email.toLowerCase());
  if(!u){ u = {id: S.nextUser++, name, email, phone}; S.users.push(u); }
  u.interest = filter || null;

  S.bookings.push({
    id: S.nextBooking++, userId: u.id,
    tourId: it.kind === "T" ? it.obj.id : null,
    eventId: it.kind === "E" ? it.obj.id : null,
    bookingDate: today, visitDate: visit, people: n, status: "Pending"
  });
  save(); renderBookings(); say(t("ok"), false);
  $("form").reset(); $("people").value = 1; $("visit").min = today; updateTotal();
});

/* ===== ميزات إضافية: الاستماع للاسم + نص عن السعودية ===== */
const EXTRA = {
  ar: {listen: "🔊 اسمعوا الاسم",
    tagline: "اكتشفوا ثقافة كل مدينة وأشهر وجهاتها وفعالياتها واحجزوا جولتكم",
    about: "أرض الحرمين ومهد الحضارات وبلد الكرم والضيافة. من رمال الربع الخالي إلى جبال السروات وشواطئ البحر الأحمر والخليج العربي، لكل ركن قصة تنتظر من يكتشفها."},
  en: {listen: "🔊 Listen to the name",
    tagline: "Discover each city's culture, top places and events, and book your tour",
    about: "Land of the Two Holy Mosques, cradle of civilizations and home of generous hospitality. From the dunes of the Empty Quarter to the Sarawat mountains and the shores of the Red Sea and the Arabian Gulf, every corner has a story waiting to be discovered."},
  fr: {listen: "🔊 Écouter le nom",
    tagline: "Découvrez la culture, les lieux phares et les événements de chaque ville, et réservez votre visite",
    about: "Terre des Deux Saintes Mosquées, berceau de civilisations et pays de l'hospitalité. Des dunes du Quart Vide aux monts Sarawat et aux rivages de la mer Rouge et du golfe Arabique, chaque coin cache une histoire à découvrir."}
};
function speakCity(id){
  if(!("speechSynthesis" in window)) return;
  const c = CITIES.find(x => x.id === id); if(!c) return;
  speechSynthesis.cancel();
  const parts = [["ar-SA", c.name.ar], ["en-US", c.name.en]];
  if(c.name.fr.toLowerCase() !== c.name.en.toLowerCase()) parts.push(["fr-FR", c.name.fr]);
  parts.forEach(([l, txt]) => {
    const u = new SpeechSynthesisUtterance(txt); u.lang = l; u.rate = 0.85; speechSynthesis.speak(u);
  });
}
function enhance(){
  const x = EXTRA[lang];
  $("tagline").textContent = x.tagline;
  $("about").textContent = x.about;
  document.querySelectorAll(".city").forEach(sec => {
    const tools = sec.querySelector(".tools");
    if(tools) tools.insertAdjacentHTML("afterbegin", `<button class="speak" type="button" data-speak="${sec.id.replace("city-", "")}">${x.listen}</button>`);
  });
}
const _render = render;
render = function(){ _render(); enhance(); };
document.addEventListener("click", e => {
  const b = e.target.closest("[data-speak]"); if(b) speakCity(+b.dataset.speak);
});

/* ===== صوت الصحراء (رياح خفيفة) ===== */
(function(){
  const st = document.createElement("style");
  st.textContent = "#soundBtn{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline-start:max(16px,env(safe-area-inset-left,0px),env(safe-area-inset-right,0px));z-index:30;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:1.25rem;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25)}";
  document.head.appendChild(st);

  let ctx, master, on = false;
  const btn = document.createElement("button");
  btn.id = "soundBtn"; btn.type = "button"; btn.textContent = "🔇";
  btn.title = "صوت الصحراء / Desert sound / Son du désert";
  btn.setAttribute("aria-label", btn.title);
  document.body.appendChild(btn);

  function build(){
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    const len = ctx.sampleRate * 4, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
    let last = 0;
    for(let i = 0; i < len; i++){ last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = last * 3.5; }
    const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
    const filt = ctx.createBiquadFilter(); filt.type = "bandpass"; filt.frequency.value = 500; filt.Q.value = 0.6;
    const gust = ctx.createGain(); gust.gain.value = 0.6;
    const lfo = ctx.createOscillator(); lfo.frequency.value = 0.12;
    const lfoG = ctx.createGain(); lfoG.gain.value = 0.35;
    lfo.connect(lfoG); lfoG.connect(gust.gain);
    const lfo2 = ctx.createOscillator(); lfo2.frequency.value = 0.07;
    const lfo2G = ctx.createGain(); lfo2G.gain.value = 180;
    lfo2.connect(lfo2G); lfo2G.connect(filt.frequency);
    master = ctx.createGain(); master.gain.value = 0;
    src.connect(filt); filt.connect(gust); gust.connect(master); master.connect(ctx.destination);
    src.start(); lfo.start(); lfo2.start();
  }
  function setOn(v){
    try {
      if(!ctx) build();
      if(ctx.state === "suspended") ctx.resume();
      on = v;
      master.gain.cancelScheduledValues(ctx.currentTime);
      master.gain.linearRampToValueAtTime(on ? 0.35 : 0, ctx.currentTime + 1.5);
      btn.textContent = on ? "🔊" : "🔇";
    } catch (e) {}
  }
  btn.addEventListener("click", () => {
    setOn(!on);
    try { localStorage.setItem("malameh_sound", on ? "on" : "off"); } catch (e) {}
  });
  /* المتصفحات تمنع الصوت قبل أول لمسة، فيبدأ مع أول ضغطة في الصفحة */
  function first(e){
    ["pointerdown", "keydown", "touchend"].forEach(n => document.removeEventListener(n, first));
    if(e.target && e.target.closest && e.target.closest("#soundBtn")) return;
    let pref = null; try { pref = localStorage.getItem("malameh_sound"); } catch (er) {}
    if(pref !== "off") setOn(true);
  }
  ["pointerdown", "keydown", "touchend"].forEach(n => document.addEventListener(n, first));
})();
$("visit").min = new Date().toISOString().slice(0, 10);
render();
</script>
